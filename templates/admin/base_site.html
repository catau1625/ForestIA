{% extends "admin/base_site.html" %}

{% block title %}ForestIA — {{ title }}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
/* Tema ForestIA para Django Admin — paleta oficial #DCE8B4 #A7C957 #6A994E #386641 #B08968 */
:root {
    --primary: #6A994E;
    --secondary: #386641;
    --accent: #B08968;
    --primary-fg: #ffffff;

    --body-fg: #22301f;
    --body-bg: #f5f8ee;
    --body-quiet-color: #5f6f52;
    --body-loud-color: #22301f;

    --header-color: #ffffff;
    --header-branding-color: #ffffff;
    --header-bg: #386641;
    --header-link-color: #dce8b4;

    --breadcrumbs-fg: #5f6f52;
    --breadcrumbs-link-fg: #386641;
    --breadcrumbs-bg: #ffffff;

    --link-fg: #386641;
    --link-hover-color: #2d5237;
    --link-selected-fg: #386641;

    --hairline-color: #d5dfc0;
    --border-color: #d5dfc0;

    --error-fg: #b0413e;
    --message-success-bg: #e9efdc;
    --message-warning-bg: #f7eeda;
    --message-error-bg: #f6e4e2;

    --darkened-bg: #edf1e0;
    --selected-bg: #dce8b4;
    --selected-row: #edf3dd;

    --button-fg: #ffffff;
    --button-bg: #386641;
    --button-hover-bg: #2d5237;
    --default-button-bg: #6A994E;
    --default-button-hover-bg: #557f3f;
    --close-button-bg: #d5dfc0;
    --close-button-hover-bg: #c3d0ab;

    --delete-button-bg: #b0413e;
    --delete-button-hover-bg: #8a3230;

    --object-tools-fg: #ffffff;
    --object-tools-bg: #B08968;
    --object-tools-hover-bg: #99755a;
}

html, body { background: #f5f8ee; }

#header { background: #386641; color: #ffffff; }
#branding h1 { font-weight: 600; letter-spacing: .01em; }
#branding h1 span { color: #a7c957; }

.module h2, .module caption, .inline-group h2 {
    background: #dce8b4;
    color: #386641;
}
.module, .inline-group {
    border: 1px solid #d5dfc0;
    border-radius: 12px;
    overflow: hidden;
    background: #ffffff;
}
#changelist .results thead th { background: #f5f8ee; }

input, textarea, select, .form-row .vTextField {
    background: #ffffff !important;
    color: #22301f !important;
    border: 1px solid #d5dfc0 !important;
    border-radius: 8px;
}
input:focus, textarea:focus, select:focus {
    border-color: #6A994E !important;
    box-shadow: 0 0 0 3px rgba(106, 153, 78, .18) !important;
    outline: none;
}

.button, input[type=submit], input[type=button], .submit-row input, a.button {
    background: #386641;
    border-radius: 8px;
    font-weight: 600;
}
.button:hover, input[type=submit]:hover, input[type=button]:hover, a.button:hover {
    background: #2d5237;
}
.button.default, input[type=submit].default, .submit-row input.default {
    background: #6A994E;
    border: none;
}
.button.default:hover, input[type=submit].default:hover {
    background: #557f3f;
}

.selector select { background: #ffffff; color: #22301f; }
div.breadcrumbs { border-radius: 0; }
.login #container { border: 1px solid #d5dfc0; border-radius: 14px; background: #ffffff; }
.login #container .form-row label { color: #22301f; }
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name">Forest<span style="color:#a7c957">IA</span></h1>
{% endblock %}
